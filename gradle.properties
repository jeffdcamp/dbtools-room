#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Android
android.useAndroidX=true

# Allow Apple (iOS/macOS) klibs to be cross-compiled on non-Mac (e.g. Linux CI) hosts so all
# targets can be assembled/published from the Linux build agent. Framework linking still needs a Mac.
kotlin.native.enableKlibsCrossCompilation=true
# Silence "task disabled on this host" warnings for Apple test tasks that cannot run on Linux.
kotlin.native.ignoreDisabledTargets=true
